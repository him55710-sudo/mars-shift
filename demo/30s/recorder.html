<!doctype html><html lang="ko"><meta charset="utf-8"><title>MARS SHIFT · Demo recording</title>
<style>*{box-sizing:border-box}body{margin:0;background:#091118;color:#d7e7ed;font:12px system-ui}.tools{height:44px;display:flex;align-items:center;gap:7px;padding:5px 10px;background:#101c25}button,a{color:inherit;background:#21323e;border:1px solid #456070;border-radius:5px;padding:5px 8px;font:inherit;text-decoration:none}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#status{margin-left:auto;white-space:nowrap}iframe{position:absolute;top:44px;left:0;width:100%;height:calc(100% - 44px);border:0;background:#0b151e}#files{display:flex;gap:5px}.recording #start{color:#ff9eaa}</style>
<div class="tools"><button id="start">녹화 시작</button><button id="stop" disabled>녹화 종료</button><span id="marks"></span><span id="files"></span><span id="status">앱 화면만 녹화 · 소리 없음</span></div>
<iframe src="http://127.0.0.1:5178/" title="MARS SHIFT actual application" allow="autoplay; display-capture"></iframe>
<script>
const scenes=['Hub','Sand2D','Sand3D','Visor','Storm2D','Storm3D','Plan','Crew','Evidence','Closing'];
const marks=document.getElementById('marks'),status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop'),files=document.getElementById('files');
let recorder,stream,began,parts=[],markers=[];
scenes.forEach(scene=>{const b=document.createElement('button');b.textContent=scene;b.addEventListener('click',()=>{if(!began)return;const mark={scene,seconds:(performance.now()-began)/1000};markers.push(mark);status.textContent=scene+' · '+mark.seconds.toFixed(2)+' s';});marks.append(b);});
function file(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=name;files.append(a);return a;}
start.addEventListener('click',async()=>{try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30,width:{ideal:1920},height:{ideal:1080},displaySurface:'browser'},audio:false,preferCurrentTab:true,selfBrowserSurface:'include'});parts=[];markers=[];const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14000000});recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};recorder.onstop=()=>{file(new Blob(parts,{type:mime}),'mars-shift-raw.webm');file(new Blob([JSON.stringify({markers,stream:stream.getVideoTracks()[0].getSettings(),viewport:{width:innerWidth,height:innerHeight},toolbar:44,duration:(performance.now()-began)/1000},null,2)],{type:'application/json'}),'mars-shift-markers.json');status.textContent='녹화 완료';stream.getTracks().forEach(t=>t.stop());start.disabled=false;stop.disabled=true;};recorder.start(1000);began=performance.now();start.disabled=true;stop.disabled=false;status.textContent='RECORDING · '+JSON.stringify(stream.getVideoTracks()[0].getSettings());document.body.classList.add('recording');}catch(e){status.textContent=e.name+': '+e.message;}});
stop.addEventListener('click',()=>recorder?.state==='recording'&&recorder.stop());
</script></html>
